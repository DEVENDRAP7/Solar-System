name: Fetch data

# Manual only. It costs Actions minutes and rewrites the source imagery, so it
# should run when you ask for it and not before.
on:
  workflow_dispatch:
    inputs:
      size:
        description: Texture size to fetch
        type: choice
        options: ['2k', '4k', '8k', 'none']
        default: '8k'
      nomenclature:
        description: Also fetch the IAU feature names
        type: boolean
        default: true
      probe:
        description: Print what the gazetteer returns, and stop
        type: boolean
        default: false

jobs:
  fetch:
    name: Fetch higher-resolution surface maps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download textures
        if: inputs.size != 'none'
        run: python3 tools/blender/fetch_hires.py --size "${{ inputs.size }}"

      - name: Probe the gazetteer
        if: inputs.probe
        run: python3 tools/blender/probe_gazetteer.py

      - name: Download feature names
        if: inputs.nomenclature
        run: python3 tools/blender/fetch_nomenclature.py

      - name: Check nothing but images landed
        run: |
          # Belt and braces around the script's own check: a bot-protection
          # page is served with a 200, and one run committed eleven of them.
          fail=0
          for f in $(git diff --name-only -- tools/blender/data | grep -E '\\.(jpg|png)$'); do
            case "$(file -b --mime-type "$f")" in
              image/*) ;;
              *) echo "NOT AN IMAGE: $f -> $(file -b --mime-type "$f")"; fail=1 ;;
            esac
          done
          exit $fail

      - name: Show what changed
        run: git -c core.pager=cat diff --stat

      - name: Commit to a branch
        run: |
          if git diff --quiet; then
            echo "No change — the committed maps already match."
            exit 0
          fi
          branch="data/${{ inputs.size }}-$(date +%Y%m%d%H%M)"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git checkout -b "$branch"
          git add tools/blender/data assets/data
          git commit -m "Fetch ${{ inputs.size }} surface maps"
          git push -u origin "$branch"
          echo "Pushed $branch. The models still need rebuilding from it:"
          echo "  blender --background --python tools/blender/build_models.py -- --out assets/models"
